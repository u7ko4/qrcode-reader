<!DOCTYPE html>
<html lang="en">
<head>
  <title>QR Code Reader</title>
  <link rel="stylesheet" type="text/css" href="inline.css">
  <meta charset="utf-8">
</head>
<body>
  <div id="panel">
    <div id="head">
      <span id="name">QR Code Reader</span>
      <span id="close" title="Close" role="button" tabindex="0">&#10005;</span>
    </div>
    <progress id="progress" value="0" max="1"></progress>
    <div id="status">Reading the image...</div>
    <div id="results"></div>
  </div>
  <script type="module" src="inline.mjs"></script>
</body>
</html>
